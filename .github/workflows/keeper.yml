name: keeper
on:
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sweep the curves, wire the boxes into dollars, burn $WIRE
        run: |
          curl -sS --max-time 90 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://wireoffice.vercel.app/api/tick
